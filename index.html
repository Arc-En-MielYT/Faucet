<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arc Faucet Hub</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #0f0f0f;
      color: #f5f5f5;
      padding: 40px 20px;
    }

    h1 {
      color: #FF9900;
      margin-bottom: 20px;
    }

    p {
      font-size: 18px;
      margin-bottom: 40px;
    }

    .crypto-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 20px;
      max-width: 800px;
      margin: 0 auto;
    }

    .crypto-button {
      background: #1a1a1a;
      color: #fff;
      text-decoration: none;
      padding: 20px;
      border-radius: 12px;
      font-weight: bold;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }

    .crypto-button:hover {
      background: #FF9900;
      color: #000;
      transform: translateY(-3px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.5);
    }

    .crypto-icon {
      font-size: 32px;
      margin-bottom: 10px;
    }

    footer {
      margin-top: 50px;
      font-size: 14px;
      color: #888;
    }
  </style>
</head>
<body>
  <h1>💧 Arc Faucet Hub</h1>
  <p>Choisis une crypto et accède à ses faucets via xno.click pour gagner des NANO !</p>

  <div class="crypto-grid">
    <a href="./faucet/nano/" class="crypto-button">
      <span class="crypto-icon">🔵</span>
      Nano
    </a>

    <a href="./ban/" class="crypto-button">
      <span class="crypto-icon">🍌</span>
      Banano
    </a>

    <a href="./ana/" class="crypto-button">
      <span class="crypto-icon">🍍</span>
      Ananos
    </a>

    <a href="./xro/" class="crypto-button">
      <span class="crypto-icon">🌐</span>
      XRO
    </a>

    <a href="./xdg/" class="crypto-button">
      <span class="crypto-icon">🐶</span>
      XDG
    </a>

    <a href="./nanusd/" class="crypto-button">
      <span class="crypto-icon">💲</span>
      NanoUSD
    </a>

    <a href="./duco/" class="crypto-button">
      <span class="crypto-icon">💎</span>
      Duco
    </a>
  </div>

  <footer>
    Créé par Arc‑en‑Miel | <a href="https://github.com/Arc-En-MielYT" style="color:#FF9900;">GitHub</a>
  </footer>
</body>
</html>
